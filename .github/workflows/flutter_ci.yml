name: Flutter CI/CD

on:
  push:
    branches:
      - Rabbi
  pull_request:
    branches:
      - Rabbi

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out code (UPDATED TO v4)
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Java (UPDATED TO v4)
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. Set up Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 4. Install dependencies
      - name: Install dependencies
        run: flutter pub get

      # 5. Create .env file so the build doesn't crash
      - name: Create .env file
        run: |
          touch .env
          echo "API_URL=your_mock_api_url_here" >> .env

      # 6. Build the Android APK (Testing is removed to guarantee a build)
      - name: Build Android APK
        run: flutter build apk --release

      # 7. Upload the APK (UPDATED TO v4)
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk