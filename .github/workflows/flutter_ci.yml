
  name: Flutter CI/CD

  on:
    push:
      branches:
        - Rabbi
    pull_request:
      branches:
        - Rabbi

  jobs:
    build-and-test:
      runs-on: ubuntu-latest

      steps:
        # 1. Check out code
        - name: Checkout repository
          uses: actions/checkout@v4

        # 2. Set up Java 17
        - name: Set up Java
          uses: actions/setup-java@v4
          with:
            distribution: 'zulu'
            java-version: '17'

        # 3. Set up Flutter
        - name: Set up Flutter
          uses: subosito/flutter-action@v2
          with:
            flutter-version: '3.44.1'
            channel: 'stable'
            cache: true

        # 4. Configure Android SDK
        - name: Configure Android SDK
          run: |
            echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
            echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
            echo "/usr/local/lib/android/sdk/cmdline-tools/16.0/bin" >> $GITHUB_PATH
            echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH

        # 5. Accept Android SDK licenses
        - name: Accept Android SDK licenses
          run: |
            yes | /usr/local/lib/android/sdk/cmdline-tools/16.0/bin/sdkmanager --licenses > /dev/null || true

        # 6. Install Android SDK 36
        - name: Install Android SDK 36
          run: |
            /usr/local/lib/android/sdk/cmdline-tools/16.0/bin/sdkmanager \
              "platforms;android-36" \
              "build-tools;36.0.0"

        # 7. Verify Android SDK
        - name: Check Android SDK
          run: |
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
            
            ls -la "$ANDROID_HOME/platforms"
            ls -la "$ANDROID_HOME/platforms/android-36"
            
            /usr/local/lib/android/sdk/cmdline-tools/16.0/bin/sdkmanager --list | grep "platforms;android-36" || true

        # 8. Check Flutter
        - name: Check Flutter
          run: |
            flutter --version
            flutter doctor -v

        # 9. Install dependencies
        - name: Install dependencies
          run: flutter pub get

        # 10. Create .env file
        - name: Create .env file
          run: |
            echo "BASE_URL=${{ secrets.BASE_URL }}" > .env

        # 11. Clean previous build files
        - name: Flutter clean
          run: flutter clean

        # 12. Get dependencies again after clean
        - name: Flutter pub get
          run: flutter pub get

        # 13. Build Android APK
        - name: Build Android APK
          run: flutter build apk --release

        # 14. Upload APK
        - name: Upload APK Artifact
          uses: actions/upload-artifact@v4
          with:
            name: app-release-apk
            path: build/app/outputs/flutter-apk/app-release.apk
            if-no-files-found: error

