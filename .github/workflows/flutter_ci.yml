name: Flutter CI/CD

# This tells GitHub to run this script ONLY when you push to the "Rabbi" branch
on:
  push:
    branches:
      - Rabbi
  pull_request:
    branches:
      - Rabbi

jobs:
  build-and-test:
    # We use Ubuntu to build Android. (macOS is needed for iOS but costs more free minutes)
    runs-on: ubuntu-latest

    steps:
      # 1. Check out your code from the GitHub repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Set up Java (Required to build Android APKs)
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. Set up the Flutter SDK
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable' # Uses the latest stable Flutter version

      # 4. Install dependencies (pub get)
      - name: Install dependencies
        run: flutter pub get

      # ⚠️ IMPORTANT: Recreate your .env file for the CI environment
      # Since .env is usually ignored in GitHub, the build will fail without this!
      - name: Create .env file
        run: |
          touch .env
          echo "API_URL=your_mock_api_url_here" >> .env
          # Add any other variables your app needs to run here

      # 5. Run standard Flutter tests
      - name: Run Tests
        run: flutter test

      # 6. Build the Android APK
      - name: Build Android APK
        run: flutter build apk --release

      # 7. Upload the APK so you can download it from GitHub
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk